<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Article Review</title>
</head>
<body>
    <h1>Articles Awaiting Approval</h1>

    {% for article in articles %}
        <article>
            <h2>{{ article.title }}</h2>

            <p>
                Author: {{ article.author.username }}
            </p>

            <p>
                {{ article.content }}
            </p>

            <form
                method="post"
                action="{% url 'approve-article' article.id %}"
            >
                {% csrf_token %}
                <button type="submit">
                    Approve Article
                </button>
            </form>
        </article>
        <hr>
    {% empty %}
        <p>No articles are awaiting approval.</p>
    {% endfor %}
</body>
</html>
